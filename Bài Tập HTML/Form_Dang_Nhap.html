<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Form đăng nhập javascript </title>
</head>
<body>
    <form id="loginForm">
        <table style="border: 0; text-align: center;">
            <tr>
                <td>Tên đăng nhập</td>
                <td><input type="text" name="txtTDN"> (Nhiều hơn 6 ký tự.)</td>
            </tr>
            <tr>
                <td>Mật khẩu</td>
                <td><input type="password" name="txtMK"></td>
            </tr>
            <tr>
                <td>Xác nhận mật khẩu</td>
                <td><input type="password" name="txtXNMK"></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" name="btnDN" value="OK">
                    <input type="reset" value="Hủy">
                </td>
            </tr>
        </table>
    </form>
     <script type="text/javascript" src="/Bài Tập JavaScript/Form_Dang_Nhap.js"></script>
</body>
</html>
