<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ảnh background hình máy ảnh</title>
    <style>
        *{
            margin: 0;
        }
        .chung{
            position: relative;
            background: url('./images/ảnh\ máy\ ảnh.jpg!w700wp') no-repeat center fixed;
            background-size: cover;
            height: 600px;
        }
        .mehim{
            text-align: center;
            position: absolute;
            top:50%;
            left:50%;
            transform: translate(-50%, -50%); 
            color: white;
            padding: 5px;
        }
        button{
            border: none;
            padding: 10px 20px 10px 20px;
            margin: 10px;
            background-color: rgb(40, 125, 40);
            color: white;
        }
        button:hover{
            background-color: yellow;
            color: black; 
        }
    </style>
</head>
<body>
    <div class="chung">
        <div class="mehim">
            <h1>I am Tran Duy Khanh</h1>
            <h3>And I'm a Photographer</h3>
            <button>Hire me</button>
        </div>
    </div>
    <br>
    <p>Page content..</p>
    <p>Note that this technique will also make the image responsive: Resize the browser window to see the effect.</p>

</body>
</html>
