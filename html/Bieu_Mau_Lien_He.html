<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu mẫu quan hệ trong HTML </title>
    <link rel="stylesheet" href="/CSS/style_Bieu_Mau_Quan_He.css" >
</head>
<body>
    <h3>Contact Form</h3>
    <div class="QuanHe">
            <form action="">
                <label for="fname">First Name</label><br>
                <input type="text" id="fname" name="fname" placeholder="Trần"><br>
                <label for="lname">Last Name</label><br>
                <input type="text" id="lname" name="lname" placeholder="Duy Khánh"><br>
                <label for="country">Country</label><br>
                <select name="country" id="country"><br>
                    <option value="An Giang">An Giang</option>
                    <option value="TP.Hồ Chí Minh">TP.Hồ Chí Minh</option>
                    <option value="Hà Nội">Hà Nội</option>
                    <option value="Đồng Tháp">Đồng Tháp</option>
                </select><br>
                <label for="subject">Subject</label><br>
                <textarea id="subject" name="subject" style="height:200px;" rows="10" cols="30" placeholder="Write somethink.."></textarea><br>

                <input type="submit" value="submit">
            </form>
    </div>
</body>
</html>
